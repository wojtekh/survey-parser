# Fallback for a plain Docker + nginx host. If deploying via Coolify (see
# README section 5), THIS FILE ISN'T USED -- Coolify builds straight from
# the Dockerfile as a "Dockerfile-based Application", not a docker-compose
# resource, and manages env vars and persistent storage through its own UI
# instead. The volume below matters for this file's own docker-compose
# deployment path; for Coolify, the equivalent step is adding a persistent
# volume in the app's "Storages" tab, mounted at /app/data -- do that once,
# or the embedded SQLite clients database gets wiped on every redeploy.
services:
  survey-parser:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # Bound to localhost only -- same pattern as Dograh's own containers.
    # nginx (already running on this box for Dograh) is what actually faces
    # the internet; this port never needs to be publicly reachable directly.
    # 3011 picked to avoid clashing with Dograh's own 3010 -- change freely.
    ports:
      - "127.0.0.1:3011:3000"
    volumes:
      - survey_parser_data:/app/data

volumes:
  survey_parser_data:
